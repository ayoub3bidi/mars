services:
  mars_api:
    image: mars_api:latest
    build:
      context: .
      dockerfile: ./Dockerfile
      target: api
    env_file: [.env]
    environment:
      MARS_AGENT_ENABLED: ${MARS_AGENT_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://mars_mock_llm:9000/v1}
    ports:
      - "${MARS_API_PORT:-8000}:8000"
    networks: [mars_api]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mars_cache:
        condition: service_healthy
      mars_db:
        condition: service_healthy
      mars_migrate:
        condition: service_completed_successfully
      mars_seed_local:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mars_cache:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--databases", "16"]
    networks: [mars_api]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mars_migrate:
    image: mars_api:latest
    build:
      context: .
      dockerfile: ./Dockerfile
      target: api
    env_file: [.env]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mars_db:
        condition: service_healthy
    networks: [mars_api]

  mars_db:
    image: postgres:16-alpine
    ports:
      - "${MARS_DB_PORT:-5432}:5432"
    restart: always
    volumes:
      - marsdb:/var/lib/postgresql/data
    env_file: [.env]
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    networks: [mars_api]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mars_seed_local:
    image: mars_api:latest
    build:
      context: .
      dockerfile: ./Dockerfile
      target: api
    env_file: [.env]
    command: ["python", "src/seed_local_admin.py"]
    depends_on:
      mars_migrate:
        condition: service_completed_successfully
    networks: [mars_api]

  mars_worker:
    image: mars_worker:latest
    build:
      context: .
      dockerfile: ./Dockerfile
      target: worker
    env_file: [.env]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://mars_mock_llm:9000/v1}
    profiles: [worker, agent]
    healthcheck:
      disable: true
    depends_on:
      mars_cache:
        condition: service_healthy
      mars_db:
        condition: service_healthy
      mars_migrate:
        condition: service_completed_successfully
    networks: [mars_api]

  mars_mock_llm:
    image: mars_api:latest
    build:
      context: .
      dockerfile: ./Dockerfile
      target: api
    env_file: [.env]
    profiles: [agent]
    command: ["uvicorn", "agent.mock_llm:app", "--app-dir", "/app/src", "--host", "0.0.0.0", "--port", "9000"]
    healthcheck:
      disable: true
    networks: [mars_api]

  mars_integration_tests:
    profiles: [test]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: integration_tests
    env_file: [.env]
    depends_on:
      mars_db:
        condition: service_healthy
      mars_cache:
        condition: service_healthy
      mars_migrate:
        condition: service_completed_successfully
    networks: [mars_api]

  mars_unit_tests:
    profiles: [test]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: unit_tests
    env_file: [.env]

  mars_linter:
    profiles: [test]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: linter
    env_file: [.env]

  mars_security:
    profiles: [test]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: code_scanner
    env_file: [.env]

volumes:
  marsdb:

networks:
  mars_api:
    driver: bridge
