services:

  mars_api:
    restart: always
    image: mars_api:latest
    build:
      context: .
      dockerfile: ./Dockerfile
      target: api
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - mars_api
    depends_on:
      mars_cache:
        condition: service_healthy
      mars_db:
        condition: service_healthy
      mars_migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mars_cache:
    image: redis:7-alpine
    restart: always
    container_name: mars_cache
    networks:
      - mars_api
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mars_migrate:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: api
    container_name: mars_migrate
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      mars_db:
        condition: service_healthy
    networks:
      - mars_api

  mars_db:
    image: postgres:16-alpine
    container_name: mars_db
    restart: always
    volumes:
      - marsdb:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - mars_api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mars_integration_tests:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: integration_tests
    env_file:
      - .env
    depends_on:
      mars_db:
        condition: service_healthy
      mars_cache:
        condition: service_healthy
      mars_migrate:
        condition: service_completed_successfully
    networks:
      - mars_api

  mars_unit_tests:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: unit_tests
    env_file:
      - .env

  mars_linter:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: linter
    env_file:
      - .env

  mars_security:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: code_scanner
    volumes:
      - .:/app
    env_file:
      - .env

volumes:
  marsdb:

networks:
  mars_api:
    driver: bridge
