name: Unit and Integration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create environment file
        run: |
          cat << 'ENVFILE' > .env
          LISTEN_ADDR=0.0.0.0
          LISTEN_PORT=8000
          APP_VERSION=0.1.0
          APP_TITLE=Mars
          APP_DESCRIPTION=Mars API
          API_VERSION=v1
          POSTGRES_HOST=mars_db
          POSTGRES_PORT=5432
          POSTGRES_DB=mars
          POSTGRES_USER=mars
          POSTGRES_PASSWORD=mars
          REDIS_HOST=mars_cache
          JWT_SECRET_KEY=test-secret-key
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          ENVFILE

      - name: Run unit tests
        run: setsid ./ci/unit-test.sh

      - name: Run integration tests
        run: setsid ./ci/integration-test.sh
