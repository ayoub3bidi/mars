name: Unit and Integration Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create local CI environment
        run: |
          cat > .env <<'ENVFILE'
          LISTEN_ADDR=0.0.0.0
          LISTEN_PORT=8000
          APP_VERSION=0.2.0
          APP_TITLE=Mars
          APP_DESCRIPTION=Mars API
          API_VERSION=v1
          APP_ENV=local
          POSTGRES_HOST=mars_db
          POSTGRES_PORT=5432
          POSTGRES_DB=mars
          POSTGRES_USER=mars
          POSTGRES_PASSWORD=mars
          REDIS_HOST=mars_cache
          JWT_SECRET_KEY=local-ci-secret
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          ENVFILE
      - name: Run unit tests
        run: ./ci/unit-test.sh
      - name: Run integration tests
        run: ./ci/integration-test.sh
