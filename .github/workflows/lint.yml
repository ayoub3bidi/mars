name: Linter

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create local CI environment
        run: |
          cat > .env <<'ENVFILE'
          LISTEN_ADDR=0.0.0.0
          APP_TITLE=Mars
          APP_DESCRIPTION=Mars API
          POSTGRES_HOST=mars_db
          POSTGRES_PORT=5432
          POSTGRES_DB=mars
          POSTGRES_USER=mars
          POSTGRES_PASSWORD=mars
          JWT_SECRET_KEY=local-ci-secret
          ENVFILE
      - name: Run Ruff
        run: ./ci/lint.sh
