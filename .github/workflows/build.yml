name: Build and Publish Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create local CI environment
        run: |
          cat > .env <<'ENVFILE'
          LISTEN_ADDR=0.0.0.0
          LISTEN_PORT=8000
          APP_VERSION=0.2.0
          APP_TITLE=Mars
          APP_DESCRIPTION=Mars API
          API_VERSION=v1
          APP_ENV=local
          POSTGRES_HOST=mars_db
          POSTGRES_PORT=5432
          POSTGRES_DB=mars
          POSTGRES_USER=mars
          POSTGRES_PASSWORD=mars
          REDIS_HOST=mars_cache
          JWT_SECRET_KEY=local-ci-secret
          JWT_ALGORITHM=HS256
          ENVFILE
      - name: Run unit tests
        run: ./ci/unit-test.sh
      - name: Run integration tests
        run: ./ci/integration-test.sh
      - name: Run Ruff
        run: ./ci/lint.sh
      - name: Run Bandit
        run: ./ci/security.sh
      - name: Run agent runtime and migration E2E
        run: ./ci/agent-e2e.sh
  build-publish:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: |
            ayoub3bidi/mars:latest
            ghcr.io/${{ github.repository_owner }}/mars:latest
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ayoub3bidi/mars:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned images
        run: |
          docker push ayoub3bidi/mars:latest
          docker push ghcr.io/${{ github.repository_owner }}/mars:latest
