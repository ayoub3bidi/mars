name: Security and Image Scan

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create local CI environment
        run: |
          cat > .env <<'ENVFILE'
          LISTEN_ADDR=0.0.0.0
          APP_TITLE=Mars
          APP_DESCRIPTION=Mars API
          POSTGRES_HOST=mars_db
          POSTGRES_PORT=5432
          POSTGRES_USER=mars
          POSTGRES_PASSWORD=mars
          POSTGRES_DB=mars
          JWT_SECRET_KEY=local-ci-secret
          ENVFILE
      - name: Run Bandit
        run: ./ci/security.sh
      - name: Build API image
        run: docker build --target api --tag mars:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: mars:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
